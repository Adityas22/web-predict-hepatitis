services:
  - type: web
    name: hepacheck-ml-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ML_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
